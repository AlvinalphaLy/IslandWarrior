<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odyssey — The Gates of Troy</title>
  <meta name="description" content="Odyssey: break open the Trojan Horse and set sail for Ithaca.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%234f9be0%22/%3E%3Crect x=%223%22 y=%225%22 width=%2210%22 height=%228%22 fill=%22%2378c850%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./home/style.css">
</head>
<body>

  <!-- ================= TROY AT DUSK (the home scene) ================= -->
  <main id="scene" class="scene">
    <canvas id="stars" class="layer" aria-hidden="true"></canvas>
    <div id="twinkles" class="layer" aria-hidden="true"></div>

    <div class="moon" aria-hidden="true"><div class="moon-disc"></div></div>

    <!-- City of Troy: wall, towers and lit windows -->
    <div class="troy" aria-hidden="true">
      <div class="tower" style="--x:4vw;  --w:9vw; --h:24vh"><i class="win" style="left:30%;top:28%"></i><i class="win" style="left:60%;top:52%"></i></div>
      <div class="tower" style="--x:22vw; --w:7vw; --h:20vh"><i class="win" style="left:40%;top:35%"></i></div>
      <div class="tower" style="--x:71vw; --w:7vw; --h:21vh"><i class="win" style="left:45%;top:30%"></i></div>
      <div class="tower" style="--x:87vw; --w:10vw; --h:26vh"><i class="win" style="left:25%;top:25%"></i><i class="win" style="left:62%;top:45%"></i></div>
      <div class="wall"><div class="gate"></div></div>
    </div>

    <div class="ground" aria-hidden="true"><div class="road"></div></div>

    <!-- Torches: two distant on the wall, two close on the ground -->
    <div class="torch" style="--x:33vw; --b:36vh; --s:.6vh" aria-hidden="true"><div class="torch-glow"></div><div class="flame"><i></i><i></i><i></i></div><div class="embers"><i></i><i></i></div><div class="bowl"></div><div class="pole"></div></div>
    <div class="torch" style="--x:67vw; --b:36vh; --s:.6vh" aria-hidden="true"><div class="torch-glow"></div><div class="flame"><i></i><i></i><i></i></div><div class="embers"><i></i><i></i></div><div class="bowl"></div><div class="pole"></div></div>
    <div class="torch" style="--x:9vw;  --b:6vh;  --s:1.5vh" aria-hidden="true"><div class="torch-glow"></div><div class="flame"><i></i><i></i><i></i></div><div class="embers"><i></i><i></i></div><div class="bowl"></div><div class="pole"></div></div>
    <div class="torch" style="--x:91vw; --b:6vh;  --s:1.5vh" aria-hidden="true"><div class="torch-glow"></div><div class="flame"><i></i><i></i><i></i></div><div class="embers"><i></i><i></i></div><div class="bowl"></div><div class="pole"></div></div>

    <!-- The horse + what's hidden inside it -->
    <section id="stage" class="stage">
      <div class="horse-shadow" aria-hidden="true"></div>

      <!-- Revealed interior: sits BEHIND the horse until it splits open -->
      <div id="reveal" class="reveal" aria-hidden="true">
        <div class="door-glow"></div>
        <div class="rays"></div>
        <div class="doorway"></div>
      </div>

      <!-- Horse art (two clipped halves + crack overlay) is generated by script.js -->
      <div id="horse" class="horse" role="button" tabindex="0"
           aria-label="The Trojan Horse. Strike it three times to break it open."></div>
    </section>

    <div id="motes" class="layer" aria-hidden="true"></div>
    <div class="vignette layer" aria-hidden="true"></div>

    <h1 id="title" class="title" aria-hidden="true"><span class="ody">ODYSSEY</span></h1>
    <p id="hint" class="hint" aria-live="polite">&#9876; Strike the horse &#9876;</p>
  </main>

  <!-- Particle layer for planks, dust and sparks -->
  <canvas id="fx" class="fx" aria-hidden="true"></canvas>

  <!-- Light flash used by the doorway transition -->
  <div id="flash" class="flash" aria-hidden="true"></div>

  <!-- Custom cursor: a Greek xiphos (tip = hotspot) -->
  <div id="cursor" class="cursor" aria-hidden="true">
    <div class="aim">
      <div class="swing">
        <svg viewBox="0 0 16 48" width="24" height="72">
          <!-- leaf-shaped blade -->
          <polygon points="8,0 10,4 11,10 12,18 11,25 10,30 6,30 5,25 4,18 5,10 6,4" fill="#dfe5ec" stroke="#1a1410" stroke-width="1" stroke-linejoin="round"/>
          <polygon points="8,1.5 9.6,4.5 10.4,10 11.2,18 10.3,25 9.5,29.5 8,29.5" fill="#9aa6b5"/>
          <rect x="7.6" y="5" width="0.8" height="24" fill="#ffffff" opacity=".8"/>
          <!-- bronze cross-guard -->
          <rect x="2" y="29" width="12" height="3" fill="#c8892e" stroke="#1a1410" stroke-width="1"/>
          <rect x="3" y="29.6" width="10" height="0.9" fill="#f3c766"/>
          <!-- leather grip -->
          <rect x="6.5" y="32" width="3" height="10" fill="#6a3a1a" stroke="#1a1410" stroke-width="1"/>
          <rect x="6.5" y="34" width="3" height="1" fill="#a3642c"/>
          <rect x="6.5" y="37" width="3" height="1" fill="#a3642c"/>
          <rect x="6.5" y="40" width="3" height="1" fill="#a3642c"/>
          <!-- pommel -->
          <rect x="5" y="42" width="6" height="4" fill="#c8892e" stroke="#1a1410" stroke-width="1"/>
          <rect x="6" y="43" width="2" height="1" fill="#f3c766"/>
        </svg>
      </div>
    </div>
  </div>

  <script type="module" src="./home/script.js"></script>
</body>
</html>
